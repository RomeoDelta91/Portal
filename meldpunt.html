<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldpunt Weersverschijnselen – MDS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #e9fdf7, #d2f7ef);
        color: #0a2a2f;
    }

    h2 {
        text-align: center;
        margin-top: 25px;
        font-size: 32px;
        letter-spacing: 1.5px;
        color: #003c46;
        text-shadow: 0 0 12px rgba(0, 255, 200, 0.4);
        animation: glowPulse 3s infinite ease-in-out;
    }

    @keyframes glowPulse {
        0% { text-shadow: 0 0 8px rgba(0,255,200,0.3); }
        50% { text-shadow: 0 0 18px rgba(0,255,200,0.7); }
        100% { text-shadow: 0 0 8px rgba(0,255,200,0.3); }
    }

    /* ⭐ TERUG NAAR EXPLORE KNOP */
    .back-button {
        display: block;
        width: fit-content;
        margin: 10px auto 0 auto;
        padding: 10px 18px;
        background: #00c4a7;
        color: white;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 0 12px rgba(0,255,200,0.4);
        transition: 0.25s;
    }

    .back-button:hover {
        background: #009e8a;
        box-shadow: 0 0 18px rgba(0,255,200,0.7);
        transform: translateY(-2px);
    }

    .container {
        width: 90%;
        max-width: 750px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.4);
    }

    #map {
        height: 350px;
        width: 100%;
        border-radius: 14px;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 255, 200, 0.4);
        box-shadow: 0 0 18px rgba(0, 255, 200, 0.35);
        overflow: hidden;
    }

    label {
        font-weight: 600;
        margin-top: 12px;
        display: block;
        color: #003c46;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #bcdad4;
        background: rgba(255, 255, 255, 0.8);
        font-size: 15px;
        transition: 0.25s;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #00ffd5;
        box-shadow: 0 0 12px rgba(0, 255, 213, 0.5);
        background: rgba(255, 255, 255, 0.95);
        transform: scale(1.01);
    }

    button {
        margin-top: 25px;
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #00c4a7, #009e8a);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: 0.25s;
        box-shadow: 0 0 12px rgba(0, 255, 200, 0.4);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 20px rgba(0, 255, 200, 0.7);
    }

    #contactFields {
        margin-top: 18px;
        padding: 18px;
        background: rgba(230, 248, 255, 0.7);
        border-radius: 12px;
        border: 1px solid #b7e7ff;
        box-shadow: 0 0 12px rgba(0, 180, 255, 0.25);
        animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    #loadingOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 20, 20, 0.55);
        backdrop-filter: blur(6px);
        display: none;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        z-index: 9999;
    }

    .loader {
        width: 70px;
        height: 70px;
        border: 6px solid rgba(0,255,200,0.3);
        border-top-color: #00ffd5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 18px rgba(0,255,200,0.6);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-text {
        margin-top: 15px;
        color: #dffff8;
        font-size: 18px;
        text-shadow: 0 0 10px rgba(0,255,200,0.6);
    }

    #successPopup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 20, 20, 0.55);
        backdrop-filter: blur(6px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .popup-box {
        background: rgba(255,255,255,0.8);
        padding: 25px;
        border-radius: 15px;
        width: 85%;
        max-width: 350px;
        text-align: center;
        box-shadow: 0 0 25px rgba(0,255,200,0.4);
        animation: fadeIn 0.4s ease-out;
    }

    .popup-box h3 {
        margin-bottom: 10px;
        color: #004d4d;
    }

    .popup-box button {
        margin-top: 15px;
        padding: 10px 20px;
        background: #00c4a7;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        box-shadow: 0 0 12px rgba(0,255,200,0.5);
    }

    .popup-box button:hover {
        background: #009e8a;
    }
</style>
</head>

<body>

<h2>⚡ Meldpunt Weersverschijnselen</h2>

<!-- ⭐ TERUG NAAR EXPLORE KNOP -->
<a href="explore.html" class="back-button">
  🧭 Terug naar Explore <span id="explore-year"></span>
</a>

<div class="container">

    <label>Locatie van waarneming (klik op de kaart)</label>
    <div id="map"></div>

    <label>Latitude</label>
    <input type="text" id="lat" readonly>

    <label>Longitude</label>
    <input type="text" id="lng" readonly>

    <label>Datum van waarneming</label>
    <input type="date" id="datum">

    <label>Tijd van waarneming</label>
    <input type="time" id="tijd">

    <label>Wat heb je waargenomen?</label>
    <select id="type">
        <option value="">-- Kies een optie --</option>
        <option>Bliksem</option>
        <option>Rukwind</option>
        <option>Windhoos</option>
        <option>Wateroverlast</option>
        <option>Waterhoos</option>
        <option>Hagel</option>
        <option>Andere</option>
    </select>

    <label>Beschrijf de schade</label>
    <textarea id="schade" rows="4"></textarea>

    <label>Wil je gecontacteerd worden?</label>
    <select id="contact">
        <option value="Nee">Nee</option>
        <option value="Ja">Ja</option>
    </select>

    <div id="contactFields" style="display:none;">
        <label>Naam</label>
        <input type="text" id="naam">

        <label>Telefoonnummer</label>
        <input type="text" id="telefoon">

        <label>E-mail (optioneel)</label>
        <input type="email" id="email">
    </div>

    <button onclick="verstuurMelding()">Melding versturen</button>

</div>

<div id="loadingOverlay">
    <div class="loader"></div>
    <p class="loading-text">AI is jouw melding aan het verwerken...</p>
</div>

<div id="successPopup">
    <div class="popup-box">
        <h3>✔️ Melding ontvangen</h3>
        <p>Bedankt voor je bijdrage aan het monitoren van extreme weersverschijnselen.</p>
        <button onclick="closeSuccess()">Sluiten</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
var map = L.map('map').setView([4.0, -55.0], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
}).addTo(map);

var marker;

map.on('click', function(e) {
    var lat = e.latlng.lat.toFixed(6);
    var lng = e.latlng.lng.toFixed(6);

    document.getElementById('lat').value = lat;
    document.getElementById('lng').value = lng;

    if (marker) {
        marker.setLatLng(e.latlng);
    } else {
        marker = L.marker(e.latlng).addTo(map);
    }
});

document.getElementById('contact').addEventListener('change', function() {
    document.getElementById('contactFields').style.display =
        this.value === 'Ja' ? 'block' : 'none';
});

function verstuurMelding() {
    document.getElementById("loadingOverlay").style.display = "flex";

    var payload = {
        lat: document.getElementById("lat").value,
        lng: document.getElementById("lng").value,
        datum: document.getElementById("datum").value,
        tijd: document.getElementById("tijd").value,
        type: document.getElementById("type").value,
        schade: document.getElementById("schade").value,
        contact: document.getElementById("contact").value,
        naam: document.getElementById("naam").value,
        telefoon: document.getElementById("telefoon").value,
        email: document.getElementById("email").value
    };

    fetch("https://klima2025.pythonanywhere.com/proxy", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
    })
    .finally(() => {
        document.getElementById("loadingOverlay").style.display = "none";
        document.getElementById("successPopup").style.display = "flex";
    });
}

function closeSuccess() {
    document.getElementById("successPopup").style.display = "none";
}
</script>

<!-- ⭐ DIT ZET HET JAARTAL AUTOMATISCH -->
<script>
document.getElementById("explore-year").textContent = new Date().getFullYear();
</script>

</body>
</html>
