<style>
    body {
        margin: 0;
        padding: 40px;
        background: #0a0f1f;
        font-family: Arial, sans-serif;
        text-align: center;
        color: #e6f1ff;
    }

    h1 {
        font-size: 32px;
        color: #6ee7ff;
        text-shadow: 0 0 20px #00eaff;
        margin-bottom: 10px;
    }

    p {
        color: #9bdfff;
        font-size: 18px;
        margin-bottom: 40px;
    }

    .button-container {
        display: flex;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
        margin-top: 30px;
    }

    .report-button {
        padding: 20px 40px;
        font-size: 20px;
        background: rgba(255,255,255,0.08);
        border: 1px solid #00eaff;
        border-radius: 15px;
        color: #6ee7ff;
        text-decoration: none;
        box-shadow: 0 0 20px rgba(0,255,255,0.2);
        backdrop-filter: blur(10px);
        transition: 0.3s;
    }

    .report-button:hover {
        background: #00eaff;
        color: #00111f;
        box-shadow: 0 0 25px #00eaff;
        transform: translateY(-4px);
    }

    .back-button {
        margin-top: 50px;
        display: inline-block;
        padding: 14px 28px;
        background: #1b2a41;
        border-radius: 10px;
        color: #6ee7ff;
        border: 1px solid #00eaff;
        text-decoration: none;
        box-shadow: 0 0 12px #00eaff;
        transition: 0.3s;
    }

    .back-button:hover {
        background: #00eaff;
        color: #00111f;
        box-shadow: 0 0 20px #00eaff;
    }
