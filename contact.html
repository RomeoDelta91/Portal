<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Unit Klimatologie</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>
  <div class="contact-container">
    <a href="publiek.html" class="back-button">Terug naar Publieke Connectie</a>

    <h1>Contact</h1>
    <p class="intro">Directe communicatie met de Unit Klimatologie via het hydromet.sr contactformulier, e-mail of het onderstaande formulier.</p>

    <div class="contact-options">
      <button onclick="window.open('https://hydromet.sr/contact-2/', '_blank')">Bezoek hydromet.sr/contact</button>
      <button onclick="toggleEmails()">Toon e-mailadressen</button>
    </div>

    <div id="email-list" class="email-popup hidden">
      <a href="mailto:aanvraagklimadata@gmail.com">aanvraagklimadata@gmail.com</a>
      <a href="mailto:klimadata@hydromet.sr">klimadata@hydromet.sr</a>
    </div>

    <form action="https://formspree.io/f/mblpnnvz" method="POST" class="quick-form">
      <h2>Snel een vraag stellen</h2>
      <input type="email" name="email" placeholder="Jouw e-mailadres" required />
      <textarea name="message" placeholder="Typ hier je vraag of opmerking..." required></textarea>
      <button type="submit">Verstuur</button>
    </form>
  </div>

  <script>
    function toggleEmails() {
      document.getElementById("email-list").classList.toggle("hidden");
    }
  </script>
</body>
</html>
