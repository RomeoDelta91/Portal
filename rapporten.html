<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 Digitale Klimaatrapporten</title>
  <style>
    body {
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #fdf6e3, #fceabb);
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #8b4513;
      font-size: 28px;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.1em;
      margin-bottom: 40px;
      color: #333;
    }
    .button-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }
    .rapport-button {
      padding: 16px 32px;
      font-size: 18px;
      background-color: #d2691e;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
      display: inline-block;
    }
    .rapport-button:hover {
      background-color: #a0522d;
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }
    .terug-button {
      margin-top: 50px;
      background-color: #999;
    }
    .terug-button:hover {
      background-color: #666;
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>📊 Digitale Klimaatrapporten</h1>

  <p>
    Kies een digitaal rapport.<br>
    Deze interactieve dashboards zijn samengesteld op basis van gevalideerde waarnemingen van de Meteorologische Dienst Suriname.
  </p>

  <div class="button-container">

    <!-- ⭐ Maandrapporten opent nu jouw Daily Rainfall Dashboard -->
    <a href="https://suriname-daily-rainfall-dashboard-czgmvw3i2z759qyjaea5ce.streamlit.app/"
       target="_blank"
       class="rapport-button">📅 Digitale Maandrapportage</a>

    <a href="jaarrapporten.html" class="rapport-button">📆 Digitale Jaarrapportage</a>
  </div>

  <a href="verleden.html" class="rapport-button terug-button">⬅️ Terug naar Klimaat in het Verleden</a>
</body>
</html>
